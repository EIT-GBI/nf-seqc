name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Nextflow strict syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: nf-core/setup-nextflow@v3
        with:
          version: '26.04.4'

      - name: nextflow lint
        # This repo's own code only. The module submodules are linted in their
        # own repos (and nf-mod-dorado's unused root main.nf does not parse).
        run: |
          nextflow lint -o concise \
            main.nf subworkflows/local modules/local nextflow.config conf

      - name: Submodules match modules.versions
        # A PR that changes a version in modules.versions must move the
        # submodule with it, or this CI tests the old module. On Renovate's PRs
        # sync-submodules-pr.yml does the move; this check holds the PR until
        # it has (and catches a hand-made PR that forgot to).
        run: bash .github/scripts/check_submodules.sh

      - name: No unpinned container images
        # Every process must resolve to a specific image version, so a given
        # pipeline revision always runs the same software. :latest is only
        # for -profile dev.
        run: |
          nextflow inspect main.nf -profile test 2>/dev/null \
            | python3 .github/scripts/check_containers.py

      # A module that hardcodes publishDir publishes its output twice: once
      # itself, once from the output {} block. Comment lines are ignored.
      - name: No publishDir
        run: |
          if grep -rnE --include='*.nf' '^[[:space:]]*publishDir' .; then
            echo "::error::publishDir found; publishing belongs in the output block in main.nf"
            exit 1
          fi

  stub:
    name: Stub run (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One per platform, plus test_publish for the --instrument/--run route.
        # The fixtures under assets/test/ are marker files and zero-byte reads:
        # they exercise platform detection, sample discovery, channel wiring
        # and publishing, not the tools themselves.
        profile: [test, test_aviti, test_nanopore, test_pacbio, test_publish]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: nf-core/setup-nextflow@v3
        with:
          version: '26.04.4'

      - name: Stub run
        if: matrix.profile != 'test_publish'
        run: nextflow run . -profile ${{ matrix.profile }} -stub-run --outdir results_${{ matrix.profile }}

      # No --outdir here: it would win over the path built from
      # <publish_root>/<instrument>/<YYYY>/<run>, which is what this job tests.
      - name: Stub run (mirrored publish path)
        if: matrix.profile == 'test_publish'
        run: |
          set -euo pipefail
          nextflow run . -profile test_publish -stub-run
          out=results-test-publish/illumina_nextseq_VH00000/2026/illumina_run
          for f in illumina_run_multiqc_report.html qc/nf-seqc_session.txt \
                   TEST1_S1_L001_R1_001.fastq.gz TEST1_S1_L001_R2_001.fastq.gz; do
            test -f "$out/$f" || { echo "::error::missing $out/$f"; ls -R results-test-publish || true; exit 1; }
          done
          # A second launch into the published run must be refused.
          if nextflow run . -profile test_publish -stub-run --overwrite false; then
            echo "::error::second launch into $out was not refused"
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nextflow-log-${{ matrix.profile }}
          path: .nextflow.log
          if-no-files-found: ignore

  # TODO: a real `-profile test,docker` run and nf-test, once there are
  # miniaturised real runs to test against (assets/test/ holds marker files
  # only).
