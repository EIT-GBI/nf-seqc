# Default MultiQC config for nf-seqc, always applied. A --multiqc_config file is
# applied after it, so it can override anything here.
#
# Report order, as asked for by the lab (2026-10): unassigned barcodes, then
# the run metrics, then the FastQC plots people check first.
#   Illumina: General Statistics, Undetermined barcodes, Run Metrics,
#             %Occupied vs %PF plot, FastQC, Demultiplexing, BCL Convert.
#   AVITI:    General Statistics, Unassigned barcodes, bases2fastq,
#             FastQC, Demultiplexing.
# FastQC opens with Sequence Quality Histograms, Per Base Sequence Content and
# Adapter Content. The barcodes and Demultiplexing tables and the % Reads /
# Loading columns come from subworkflows/local/demux_report.nf, for both
# platforms.

# General Statistics stays at the top (MultiQC cannot move it). It holds
# FastQC's columns, one row per FASTQ; merge each sample's R1 and R2 into one
# row, so an AVITI run shows one row per sample (~50) rather than per file.
table_sample_merge:
  "R1": "_R1"
  "R2": "_R2"

# BCL Convert names FASTQ <sample>_S<n>[_L<lane>]_R1_001.fastq.gz, so FastQC
# rows come out as "<sample>_S1_L001" while the read-share column (from
# Demultiplex_Stats.csv) is keyed on "<sample>". Strip the suffix so the two
# land on one row.
extra_fn_clean_exts:
  - type: regex
    pattern: '_S\d+(_L\d{3})?(?=_R[12]|$)'

# Don't use top_modules for ordering: in MultiQC 1.35 listing bases2fastq there
# runs the module twice. report_section_order below does the ordering.

# bases2fastq's per-sample plots repeat what FastQC already shows (FastQC runs
# on every FASTQ anyway). Drop them; its sample table (Q30/Q40, yield, mismatch)
# and the run-level sections have no FastQC equivalent and stay.
remove_sections:
  - base_content       # = fastqc_per_base_sequence_content
  - n_content          # = fastqc_per_base_n_content
  - adapter_content    # = fastqc_adapter_content
  - gc_histogram       # = fastqc_per_sequence_gc_content

# The occupancy plot is a *_mqc.png, whose section id and title would
# otherwise come from its file name and so change with every run
# ("261006 VH02427 108 AAJJW55M5 occupied vs pf"). Give it a fixed id, so it
# can be ordered, and a readable title.
custom_data:
  illumina_occupied_vs_pf:
    section_name: "Illumina % Occupied vs % Pass Filter"
    description: "Per-tile %Occupied against %PF from InterOp. Underloaded: median %Occupied below 90%. Overloaded: %Occupied above that but median %PF below 65%. Thresholds are shared with the Concerns column of the Run Metrics table."
sp:
  illumina_occupied_vs_pf:
    fn: "*_occupied_vs_pf_mqc.png"

# Modules sort descending by `order` (defaults are small multiples of 10), so
# these explicit values place them ahead of everything else, in this order.
# Run Metrics + %Occupied plot + BCL Convert (Illumina) and bases2fastq (AVITI)
# never appear together; bases2fastq takes the Run Metrics slot.
#
# MultiQC cannot move a section out of its module, which is why the barcodes
# table is our own (demux_unknown_barcodes) rather than BCL Convert's
# undetermine_by_lane or bases2fastq's index_unassignment_metrics, both of
# which stay in their modules further down.
#
# Sections within a module sort ascending; each one's default is its position
# x 10. bases2fastq (MultiQC 1.35) emits, in order: run_qc_metrics_table,
# run_manifest_metrics_table, index_assignment_metrics,
# index_unassignment_metrics, run_metrics_bar, bq_hist, per_cycle_quality,
# then the per-sample sections. Lift the run-level plots up to sit right under
# the run QC table, ahead of the manifest and index tables. FastQC's three
# most-checked plots go first in the same way.
report_section_order:
  demux_unknown_barcodes:
    order: 1000
  illumina_run_metrics:
    order: 990
  illumina_occupied_vs_pf:
    order: 980
  bases2fastq:
    order: 990
  fastqc:
    order: 900
  demux_summary:
    order: 850
  bclconvert:
    order: 800
  run_qc_metrics_table:
    order: 1
  run_metrics_bar:
    order: 2
  bq_hist:
    order: 3
  per_cycle_quality:
    order: 4
  fastqc_per_base_sequence_quality:
    order: 1
  fastqc_per_base_sequence_content:
    order: 2
  fastqc_adapter_content:
    order: 3
